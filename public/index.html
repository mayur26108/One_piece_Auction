<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Piece Bounty Auction</title><link rel="stylesheet" href="styles.css"></head><body><main><header><h1>☠ ONE PIECE BOUNTY AUCTION</h1><p>Build your crew. Protect your bounty. Win the auction.</p></header><section id="home" class="card"><h2>Start or Join</h2><div class="grid"><div><h3>Create Lobby</h3><input id="hostName" placeholder="Your name"><input id="players" type="number" min="2" max="8" value="3" placeholder="Players"><input id="budget" type="number" min="1" value="50" placeholder="Budget"><input id="timer" type="number" min="5" max="120" value="20" placeholder="Timer (seconds)"><button id="create">Create Lobby</button></div><div><h3>Join Lobby</h3><input id="joinName" placeholder="Your name"><input id="code" placeholder="6-digit room code"><button id="join">Join Lobby</button></div></div></section><section id="game" class="hidden"><div class="topbar"><div><b>Room:</b> <span id="room"></span></div><div id="role"></div><button id="exit">Exit Game</button><button id="reset" class="hostOnly">Reset Game</button></div><div id="lobby" class="card"><h2>Lobby</h2><p>Share the room code with your friends.</p><div class="bigcode" id="lobbyCode"></div><div id="playersList"></div><button id="start" class="hostOnly">Start Auction</button></div><div id="auction" class="hidden"><div class="auction card"><div class="small">CHARACTER <span id="round"></span></div><h2 id="character">—</h2><div class="timer" id="countdown">—</div><div class="bidrow"><input id="bid" type="number" min="0" placeholder="Your bid"><button id="bidBtn">Submit Bid</button></div><p id="status"></p></div><div class="card"><h2>Crews & Bounty</h2><div id="board"></div></div></div><div id="finished" class="card hidden"><h2>🏆 Auction Finished</h2><div id="final"></div><button id="newGame">Return to Home</button></div></section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
